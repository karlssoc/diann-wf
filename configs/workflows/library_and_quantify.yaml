# Library Generation + Quantification Configuration
# Generate library from FASTA, then quantify samples

# FASTA file
fasta: '/path/to/protein.fasta'

# Sample definitions
samples:
  - id: 'sample1'
    dir: '/path/to/ms_data/sample1'
    file_type: 'd'        # 'd' for .d folders (Bruker), 'raw' for Thermo, 'mzML'
    recursive: false

  - id: 'sample2'
    dir: '/path/to/ms_data/sample2'
    file_type: 'd'
    recursive: false

  - id: 'sample3'
    dir: '/path/to/ms_data/sample3'
    file_type: 'raw'
    recursive: false

# Library name
library_name: 'generated_lib'

# Output directory
outdir: 'results/library_and_quantify'

# Optional: Subdirectory organization
# library_subdir: 'library'        # Default: 'library'
# quantify_subdir: ''               # Default: '' (flat in outdir)

# DIA-NN version
diann_version: '2.3.2'

# Thread configuration
threads: 48  # Adjust for your system

# Parallel execution mode (for SLURM/COSMOS)
parallel_mode: false

# SLURM settings
slurm_account: 'YOUR_PROJECT'
slurm_queue: 'lu'  # For COSMOS, or 'work' for other clusters

# Optional: Dynamic time allocation for quantification
# time_base_hours: 2
# time_per_file_minutes: 10

# Library generation parameters
library:
  min_fr_mz: 200
  max_fr_mz: 1800
  min_pep_len: 7
  max_pep_len: 30
  min_pr_mz: 350
  max_pr_mz: 1650
  min_pr_charge: 2
  max_pr_charge: 3
  cut: 'K*,R*,!*P'
  missed_cleavages: 1
  met_excision: true
  unimod4: true

# Quantification parameters
qvalue: 0  # 0 = DIA-NN default (0.01 = 1% FDR)

pg_level: 1
mass_acc_cal: 25
# mass_acc: 15      # MS2 mass accuracy in ppm (default: 15 for Bruker .d, DIA-NN auto otherwise)
# mass_acc_ms1: 15  # MS1 mass accuracy in ppm (default: 15 for Bruker .d, DIA-NN auto otherwise)
smart_profiling: true
individual_mass_acc: false
matrices: true

# Optional: Pre-trained model preset (see models/README.md for available presets)
# model_preset: 'ttht-evos-30spd'
# tuning_mode: 'skip'              # 'skip' = use preset directly, 'from_scratch' = tune from defaults

# Optional: Explicit model file paths (overrides model_preset)
# tokens: 'path/to/dict.txt'
# rt_model: 'path/to/tuned_rt.pt'
# im_model: 'path/to/tuned_im.pt'
# fr_model: 'path/to/tuned_fr.pt'

# Optional: Reference library for batch correction
# ref_library: '/path/to/reference/library.predicted.speclib'
# individual_windows: true
