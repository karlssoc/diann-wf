# Iterative Quantification Workflow Configuration
#
# This workflow performs:
# 1. Library generation (if not provided): Generate from FASTA
# 2. Identification stage: Quantify with full proteome library WITHOUT MBR
# 3. Library subsetting based on identified Protein.Groups
# 4. Final stage: Quantify with subset library WITH MBR
#
# Usage:
#   nextflow run karlssoc/diann-wf \
#     -entry ITERATIVE_QUANT \
#     -params-file configs/workflows/iterative_quant.yaml \
#     -profile slurm

# === Required Parameters ===

# FASTA sequence database
fasta: 'path/to/proteome.fasta'

# Sample definitions
samples:
  - id: 'sample1'
    dir: 'path/to/sample1/ms_files'
    file_type: 'raw'      # raw, mzML, d, dia, wiff
    recursive: false      # Search subdirectories

# === Optional: Pre-existing Library ===
# If provided, skip library generation and use this library directly
# Supports .parquet or .speclib formats
# existing_library: 'path/to/full_library.parquet'

# === InfinDIA Calibration Settings ===
# InfinDIA pre-search generates an empirical calibration library from a subset
# of MS files, which speeds up subsequent quantification runs.

# Calibration mode:
#   'none'     - No calibration library (default, skip presearch)
#   'infindia' - Generate calibration library via InfinDIA pre-search
#   'existing' - Use an existing calibration library
calibration_mode: 'none'

# Path to existing calibration library (required when mode='existing')
# calibration_library: 'path/to/calibration_lib.parquet'

# Number of MS files to randomly select for calibration (default: 5)
# Uses files from the first sample in the samples list
calibration_files: 5

# Instrument type for mass accuracy presets:
#   'hfx'      - Orbitrap HFX (MS1: 5ppm, MS2: 15ppm)
#   'timstof'  - timsTOF (MS1: 15ppm, MS2: 15ppm)
#   ''         - Auto-calibrate (let DIA-NN determine)
instrument_type: ''

# Limit precursors in InfinDIA for faster calibration (default: 0 = unlimited)
# Recommended: 5000-10000 for fast calibration runs
pre_select: 0

# === Library Generation Settings (when no library provided) ===

# Name for generated library (default: 'predicted_library')
library_name: 'predicted_library'

# Pre-trained model preset (optional, improves prediction accuracy)
# Available presets in models/ directory (e.g., 'ttht-evos-30spd')
# model_preset: 'ttht-evos-30spd'

# Library generation parameters (defaults shown)
library:
  min_fr_mz: 200
  max_fr_mz: 1800
  min_pep_len: 7
  max_pep_len: 30
  min_pr_mz: 350
  max_pr_mz: 1650
  min_pr_charge: 2
  max_pr_charge: 3
  cut: 'K*,R*'
  missed_cleavages: 1
  met_excision: true
  unimod4: true

# === MBR Settings ===

# Identification stage MBR (default: false - identification only)
mbr: false

# Final stage MBR (default: true - sensitive quantification)
mbr_final: true

# === Q-value Settings ===

# Q-value threshold for identification stage (default: 0.05)
# Higher threshold captures more Protein.Groups for library subsetting
# (report.parquet is filtered by --qvalue; 0.05 captures ~15-30% more PGs than 0.01)
qvalue_identify: 0.05

# === File Conversion Settings ===

# Convert RAW/.d files to .dia format before processing
# Benefits: Files read only once, faster loading in subsequent stages
# Outputs to: ${outdir}/dia_converted/
convert_to_dia: true

# === Quantification Parameters ===

# Protein group level (1=proteins, 0=genes)
pg_level: 1

# Mass accuracy calibration threshold
mass_acc_cal: 25

# Smart profiling for improved quantification
smart_profiling: true

# Generate quantification matrices
matrices: true

# === Optional Batch Correction ===
# Uncomment for multi-batch experiments

# individual_mass_acc: true
# individual_windows: true
# ref_library: 'path/to/reference_library.parquet'

# === Resource Settings ===

# Output directory
outdir: 'results'

# Number of threads per job
threads: 60

# Parallel execution mode
# true: 2 jobs x 30 cores (better throughput for multiple samples)
# false: 1 job x 60 cores (full cores per sample)
parallel_mode: false

# === SLURM Settings (if using slurm profile) ===

# slurm_account: 'myaccount'
# slurm_queue: 'work'
# slurm_nodelist: 'node01'
