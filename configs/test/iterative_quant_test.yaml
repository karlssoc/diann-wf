# Iterative Quantification Test Configuration
#
# Uses test data from generate_example_data/

# Use a PREDICTED library (not empirical) - required for iterative workflow
# Empirical libraries (with q-values) cause issues with MBR in the second pass
existing_library: 'test_data/library/predicted_lib.parquet'

# Test FASTA
fasta: 'test_data/fasta/UP000002311_506-entries_2026_01_07.fasta'

# Test samples (using the .dia files)
samples:
  - id: 'test_sample'
    dir: 'generate_example_data'
    file_type: 'dia'
    recursive: false

# MBR settings
mbr: true        # Identification stage: MBR enabled, first-pass report used for subsetting
mbr_final: true  # Final stage: with MBR

# Q-value for identification stage (relaxed to capture more PGs for subsetting)
qvalue_identify: 0.05

# Quantification parameters
pg_level: 1
mass_acc_cal: 25
smart_profiling: true
matrices: true

# Output
outdir: 'results/iterative_quant_test'

# Resource settings (minimal for testing)
threads: 4
parallel_mode: false
