# ============================================================================
# qc_watch.yaml — automated MS-QC pipeline config (bin/qc-watch)
#
# Polls OpenBIS for new QC raw files, searches each with DIA-NN (quantify_only),
# records metrics in a SQLite DB, deletes the raw afterwards.
# Run via cron through bin/qc-watch.sh. See docs/qc-pipeline.md.
#
# Top-level keys are shared defaults; any of library/fasta/min_raw_mb/file_type/
# since may be overridden per instrument.
# ============================================================================

# --- storage (kraken) -------------------------------------------------------
db_path:      /srv/data1/karlssoc/projects/ms/qc/qc.sqlite  # ledger + metrics
work_dir:     /srv/data1/karlssoc/projects/ms/qc/work       # transient: raws + nf work (auto-cleaned)
results_dir:  /srv/data1/karlssoc/projects/ms/qc/results    # kept: report.stats.tsv, logs

# --- execution --------------------------------------------------------------
repo:          karlssoc/diann-wf                            # GitHub asset (nextflow pull) or local path
nextflow:      /srv/data1/karlssoc/miniconda3/envs/nf-env/bin/nextflow
java_home:     /srv/data1/karlssoc/miniconda3/envs/nf-env   # JVM for nextflow (cron has none)
profile:       standard                                     # local exec on alap759 (~35s/file).
                                                            # 'slurm' currently hits kraken's
                                                            # "terminated by external system" quirk
                                                            # for single-file QC; standard is simpler
                                                            # and faster here. Override with --profile.
diann_version: '2.3.2'
threads:       30        # cores per DIA-NN search (good-neighbour cap on the shared node)

# --- behaviour --------------------------------------------------------------
min_raw_mb:    100      # skip raws smaller than this (incomplete/blank/aborted runs)
keep_parquet:  false    # drop report.parquet + matrices after metric extraction
max_retries:   2        # retry a failed dataset at most this many times

# --- instruments (watch targets) -------------------------------------------
instruments:
  - name: minerva                 # Q-Exactive HFX + Vanquish Neo + µPAC
    collection: /DDB/CK/MINERVA_QC
    file_type: raw                # Thermo .raw -> DIA-NN auto --mass-acc 15 --mass-acc-ms1 5
    library: /srv/data1/karlssoc/projects/ms/qc/data/speclib/hfx-yeast/out-lib.parquet
    fasta:   /srv/data1/karlssoc/projects/ms/qc/data/speclib/hfx-yeast/UP000002311_559292.fasta
    since:   '2025-12-15'         # ignore datasets registered before this (optional)

  # --- Future instrument example (uncomment + adjust) -----------------------
